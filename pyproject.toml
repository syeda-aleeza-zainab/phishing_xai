[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phishing-xai"
version = "0.1.0"
description = "Phishing Email Detection with Explainable AI (LIME, Transformers-Interpret, LITA)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "ML Engineering Team" }
]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "lime>=0.2.0",
    "captum>=0.7.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "nltk>=3.8.1",
    "beautifulsoup4>=4.12.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "tqdm>=4.66.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    ".venv",
    "notebooks/legacy",
    "Phishing_Email_Detection_XAI_(LIME_TI_LITA).ipynb",
    "RANDOM_SEARCH_HYPERPARAMETER_TUNING_(RoBERTa).ipynb"
]

[tool.pyrefly]
project-excludes = [
    ".venv/**",
    "Phishing_Email_Detection_XAI_(LIME_TI_LITA).ipynb",
    "RANDOM_SEARCH_HYPERPARAMETER_TUNING_(RoBERTa).ipynb"
]

[tool.pyrefly.errors]
missing-source-for-stubs = "ignore"

